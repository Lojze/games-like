name: Monthly Game Data Refresh

# 每月 1 号 02:00 UTC 自动拉取最新游戏数据 → 重算标签/匹配 → 验证构建 → 推回 data/
# 也可在 GitHub 仓库的 Actions 页面手动点击 "Run workflow" 触发。
#
# Node 版本与 package.json / Astro 7.4.12 的 engines.node >=22.23.4 保持一致：
# scripts/*.ts 由 node 直接执行，依赖 Node 22+ 的原生 TypeScript 支持。
on:
  schedule:
    - cron: '0 2 1 * *'
  workflow_dispatch:

permissions:
  contents: write

# 定时与手动触发撞车时排队，避免两个任务同时 push 冲突
concurrency:
  group: monthly-game-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch games from RAWG
        run: npm run fetch:games
        env:
          RAWG_API_KEY: ${{ secrets.RAWG_API_KEY }}

      # 未设置 PROXY_URL，脚本会直连 Steam；只有本地需要代理时才设置该变量
      - name: Fetch Steam screenshots
        run: npm run fetch:screenshots

      - name: Clean feel tags
        run: npm run clean:tags

      - name: Compute matches
        run: npm run compute:matches

      # 依赖上一步新生成的 matches.json：为新配对补齐 "Why it fits" 高质文案，
      # 必须在构建之前执行，否则新配对只能退回卡片里的规则引擎兜底文案
      - name: Generate "Why it fits" reasons
        run: npm run generate:reasons

      # 任一前置步骤失败都会终止 job，因此构建不成功时不会执行下面的提交步骤
      - name: Verify build
        run: npm run build

      - name: Commit and push data/ changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain -- data/)" ]; then
            git add data/
            git commit -m "chore(data): refresh game data (monthly)"
            git push
          else
            echo "No changes under data/, skip commit."
          fi
